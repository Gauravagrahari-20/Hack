<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANSH BHAI • Announcement Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0b1020;color:#eef2ff;min-height:100vh;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#121a2d;border:1px solid #293451;border-radius:20px;padding:24px;box-shadow:0 20px 60px #0006}h1{margin:0 0 6px}.sub{color:#9aa7c2;margin:0 0 24px}label{display:block;font-weight:700;margin:16px 0 7px}input,textarea{width:100%;border:1px solid #34415f;background:#0d1425;color:#fff;border-radius:12px;padding:13px;font:inherit}textarea{min-height:120px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.switch{display:flex;align-items:center;gap:10px;margin:4px 0 18px}.switch input{width:20px;height:20px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{border:0;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer}#publish{background:#7c5cff;color:#fff}#clear{background:#ef476f;color:#fff}.ghost{background:#27324b;color:#fff}.status{margin-top:18px;padding:12px;border-radius:12px;background:#0d1425;color:#b9c5dc;white-space:pre-wrap}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:12px;align-items:start}.pill{padding:7px 10px;border-radius:99px;background:#1c2841;color:#9ee6b8;font-size:12px;font-weight:800}.err{color:#ff9bad}@media(max-width:600px){.row{grid-template-columns:1fr}body{padding:12px}.card{padding:18px}}</style></head><body><div class="wrap"><div class="card"><div class="top"><div><h1>ANSH BHAI</h1><p class="sub">Firebase remote announcement control</p></div><span class="pill" id="state">Signed out</span></div><section id="login"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="Firebase admin email"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Firebase admin password"><div class="buttons"><button id="loginBtn">LOGIN</button></div></section><section id="panel" class="hidden"><div class="switch"><input id="enabled" type="checkbox"><label for="enabled" style="margin:0">Show popup on ANSH BHAI</label></div><label>Title</label><input id="title" placeholder="Official Channel"><label>Message</label><textarea id="message" placeholder="Join our official channel for latest updates."></textarea><div class="row"><div><label>Button text</label><input id="buttonText" placeholder="JOIN OFFICIAL CHANNEL"></div><div><label>Auto-close (seconds)</label><input id="duration" type="number" min="1" max="3600" value="20"></div></div><label>Join URL</label><input id="joinUrl" type="url" placeholder="https://t.me/yourchannel"><div class="buttons"><button id="publish">PUBLISH / UPDATE</button><button id="clear">DISABLE & CLEAR</button><button id="logout" class="ghost">LOGOUT</button></div></section><div class="status" id="status">Connecting…</div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script>
const firebaseConfig={apiKey:"AIzaSyAyEBVIuwUaOiPhC8RkJcmE9oWo78PVzwI",authDomain:"utr-key-manager.firebaseapp.com",databaseURL:"https://utr-key-manager-default-rtdb.firebaseio.com",projectId:"utr-key-manager",storageBucket:"utr-key-manager.firebasestorage.app",messagingSenderId:"725827216922",appId:"1:725827216922:web:c34c797e19cbd5154513a3"};
firebase.initializeApp(firebaseConfig); const auth=firebase.auth(), db=firebase.database(); const $=id=>document.getElementById(id); const status=t=>$('status').textContent=t;
auth.onAuthStateChanged(async user=>{if(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('state').textContent='Authenticated';status('Loading remotePopup…');try{const s=await db.ref('remotePopup').once('value');const d=s.val()||{};$('enabled').checked=d.enabled===true;$('title').value=d.title||'';$('message').value=d.message||'';$('buttonText').value=d.buttonText||'JOIN OFFICIAL CHANNEL';$('duration').value=d.duration||20;$('joinUrl').value=d.joinUrl||'';status('Ready. Current announcement loaded.')}catch(e){status('Database error: '+e.message)}}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden');$('state').textContent='Signed out';status('Sign in with the Firebase Authentication account allowed to manage announcements.')}});
$('loginBtn').onclick=async()=>{try{status('Signing in…');await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(e){status('Login failed: '+e.message)}};
$('publish').onclick=async()=>{const url=$('joinUrl').value.trim();if(!/^https?:\/\//i.test(url)){status('Join URL must start with http:// or https://');return}const d={enabled:$('enabled').checked,title:$('title').value.trim(),message:$('message').value.trim(),buttonText:$('buttonText').value.trim()||'JOIN OFFICIAL CHANNEL',duration:Math.max(1,Math.min(3600,parseInt($('duration').value,10)||20)),joinUrl:url,updatedAt:firebase.database.ServerValue.TIMESTAMP};try{await db.ref('remotePopup').set(d);status('✓ Announcement published successfully.')}catch(e){status('Publish failed: '+e.message)}};
$('clear').onclick=async()=>{try{await db.ref('remotePopup').set({enabled:false,updatedAt:firebase.database.ServerValue.TIMESTAMP});$('enabled').checked=false;status('✓ Popup disabled.')}catch(e){status('Clear failed: '+e.message)}};
$('logout').onclick=()=>auth.signOut();
</script></body></html>
